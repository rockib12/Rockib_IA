services:
  postgres:
    image: postgres:16-alpine
    container_name: rockib_ia_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rockib}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rockib_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-rockib_ia}
    ports:
      - "127.0.0.1:5432:5432"  # Accès direct limité à localhost (anti-exposition réseau externe)
    volumes:
      - rockib_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rockib} -d ${POSTGRES_DB:-rockib_ia}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rockib_ia_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"  # Accès direct limité à localhost (anti-exposition réseau externe)
    volumes:
      - rockib_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Conteneur unifié tout-en-un : Frontend (React/Vite) + Backend (FastAPI) + Nginx
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rockib_ia_app
    restart: unless-stopped
    ports:
      - "80:80"                # Nginx (Frontend SPA + Reverse Proxy /api/ + /docs)
      - "127.0.0.1:8080:8000"  # Accès direct FastAPI Uvicorn limité à l'hôte local (debug)

    env_file:
      - .env
    volumes:
      - ./data:/app/data
    environment:
      ASYNC_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-rockib}:${POSTGRES_PASSWORD:-rockib_dev_password}@postgres:5432/${POSTGRES_DB:-rockib_ia}
      DATABASE_URL: postgresql://${POSTGRES_USER:-rockib}:${POSTGRES_PASSWORD:-rockib_dev_password}@postgres:5432/${POSTGRES_DB:-rockib_ia}
      REDIS_URL: redis://redis:6379/0
      TRUSTED_PROXY_CIDRS: '["127.0.0.0/8", "::1/128", "172.16.0.0/12"]'
      PUBLIC_API_URL: https://dion-beaverlike-preceptively.ngrok-free.dev
      CONCIERGE_WIDGET_URL: https://rockib-quenum.netlify.app/rockib-concierge.js
      GROQ_MODEL: openai/gpt-oss-120b
      APP_ENV: production
      DEBUG: "false"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/api/v1/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  rockib_pg_data:
  rockib_redis_data:
