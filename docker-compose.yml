services:
  postgres:
    image: postgres:16-alpine
    container_name: rockib_ia_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rockib
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a unique URL-safe POSTGRES_PASSWORD in .env}
      POSTGRES_DB: rockib_ia
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - rockib_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rockib -d rockib_ia"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rockib_ia_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - rockib_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Conteneur unifié tout-en-un : Frontend (React/Vite) + Backend (FastAPI) + Nginx
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rockib_ia_app
    restart: unless-stopped
    ports:
      - "80:80"                # Nginx (Frontend SPA + Reverse Proxy /api/ + /docs)
      - "127.0.0.1:8080:8000"  # Accès direct FastAPI Uvicorn limité à l'hôte local (debug)

    env_file:
      - .env
    volumes:
      - ./data:/app/data
    environment:
      ASYNC_DATABASE_URL: postgresql+asyncpg://rockib:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/rockib_ia
      DATABASE_URL: postgresql://rockib:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/rockib_ia
      REDIS_URL: redis://redis:6379/0
      PUBLIC_API_URL: https://dion-beaverlike-preceptively.ngrok-free.dev
      CONCIERGE_WIDGET_URL: https://rockib-quenum.netlify.app/rockib-concierge.js
      GROQ_MODEL: openai/gpt-oss-120b
      APP_ENV: production
      DEBUG: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  rockib_pg_data:
  rockib_redis_data:
