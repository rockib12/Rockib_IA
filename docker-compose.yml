services:
  postgres:
    image: postgres:16-alpine
    container_name: rockib_ia_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rockib
      POSTGRES_PASSWORD: rockib_dev_password
      POSTGRES_DB: rockib_ia
    ports:
      - "5432:5432"
    volumes:
      - rockib_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rockib -d rockib_ia"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rockib_ia_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - rockib_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Conteneur unifié tout-en-un : Frontend (React/Vite) + Backend (FastAPI) + Nginx
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rockib_ia_app
    restart: unless-stopped
    ports:
      - "80:80"                # Nginx (Frontend SPA + Reverse Proxy /api/ + /docs)
      - "127.0.0.1:8080:8000"  # Accès direct FastAPI Uvicorn limité à l'hôte local (debug)

    env_file:
      - .env
    environment:
      ASYNC_DATABASE_URL: postgresql+asyncpg://rockib:rockib_dev_password@postgres:5432/rockib_ia
      DATABASE_URL: postgresql://rockib:rockib_dev_password@postgres:5432/rockib_ia
      REDIS_URL: redis://redis:6379/0
      APP_ENV: production
      DEBUG: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  rockib_pg_data:
  rockib_redis_data:
